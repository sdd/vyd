[workspace]
members = [
    "crates/vyd",
    "crates/vyd_main",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Scott Donnelly"]
description = "pluggable video processing pipeline"
documentation = "https://vyd.dev/docs"

[profile.release]
debug = true

[workspace.dependencies]
vyd = { path = "./crates/vyd" }

anyhow = "1"
chrono = { version = "0.4.40", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
once_cell = "1"
parquet = "56"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
thiserror = "2"
toml = { version = "0.9", features = ["serde"] }
serde_json = "1"
