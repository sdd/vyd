[workspace]
members = [
  "crates/vyd_core",
  "crates/vyd",
  "crates/vyd_main",
  "crates/vyd_telemetry",
  "crates/vyd_gstreamer",
  "crates/vyd_gstreamer_gpu",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
authors = ["Scott Donnelly"]
description = "pluggable video processing pipeline"
repository = "https://github.com/sdd/vyd"
license = "MIT OR Apache-2.0"
readme = "README.md"

[profile.release]
debug = true

[workspace.dependencies]
vyd = { path = "./crates/vyd", version = "0.3.0" }
vyd-core = { path = "./crates/vyd_core", version = "0.2.0" }

anyhow = "1"
chrono = { version = "0.4.40", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
image = { version = "0.24", default-features = false, features = [
  "png",
  "jpeg",
] }
once_cell = "1"
vortex = { version = "=0.90.0", default-features = false, features = ["files"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
thiserror = "2"
toml = { version = "0.9", features = ["serde"] }
serde_json = "1"
