[package]
name = "vyd"
version = "0.2.1"
edition = "2024"
authors.workspace = true
description = "Configured Vyd video pipelines with a GStreamer runtime"
repository.workspace = true
license.workspace = true
readme.workspace = true
documentation = "https://docs.rs/vyd"

[features]
default = []
gpu-wgpu = ["vyd-core/gpu-wgpu", "vyd-gstreamer/gpu-wgpu"]

[dependencies]
parse-size = "1.1"
vyd-core = { workspace = true }
vyd-gstreamer = { path = "../vyd_gstreamer", version = "0.2.1" }
vyd-telemetry = { path = "../vyd_telemetry", version = "0.2.1" }
toml = { workspace = true }

[lib]
name = "vyd"
