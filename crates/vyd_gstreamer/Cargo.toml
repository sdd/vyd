[package]
name = "vyd-gstreamer"
version = "0.2.1"
edition = "2021"
authors.workspace = true
description = "GStreamer sources and sinks for Vyd video pipelines"
repository.workspace = true
license.workspace = true
readme.workspace = true
documentation = "https://docs.rs/vyd-gstreamer"

[features]
default = []
gpu-wgpu = ["vyd-core/gpu-wgpu"]

[dependencies]
vyd-core = { workspace = true }
bytes = "1"
gst = { package = "gstreamer", version = "0.21", features = ["v1_20"] }
gst-allocators = { package = "gstreamer-allocators", version = "0.21.2" }
gst-base = { package = "gstreamer-base", version = "0.21.2" }
gst-video = { package = "gstreamer-video", version = "0.21.2" }
http = "1"
image = { workspace = true }
metrics = "0.24"
once_cell = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-gstreamer = "0.9.0"
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
vyd_telemetry = { package = "vyd-telemetry", path = "../vyd_telemetry" }
serde_json = { workspace = true }
