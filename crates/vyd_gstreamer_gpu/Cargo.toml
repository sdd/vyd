[package]
name = "vyd-gstreamer-gpu"
version = "0.2.0"
edition = "2021"
authors.workspace = true
description = "Experimental GStreamer GPU buffer integration for Vyd"
repository.workspace = true
license.workspace = true
readme.workspace = true
documentation = "https://docs.rs/vyd-gstreamer-gpu"

[dependencies]
vyd-core = { workspace = true }
vyd_gstreamer = { package = "vyd-gstreamer", path = "../vyd_gstreamer", version = "0.2.0" }
bytes = "1"
gst = { package = "gstreamer", version = "0.21", features = ["v1_20"] }
gst-allocators = { package = "gstreamer-allocators", version = "0.21.2" }
gst-base = { package = "gstreamer-base", version = "0.21.2" }
gst-video = { package = "gstreamer-video", version = "0.21.2" }
http = "1"
image = { workspace = true }
metrics = "0.24"
once_cell = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
